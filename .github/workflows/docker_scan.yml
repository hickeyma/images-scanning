# .github/workflows/docker_scan.yml
name: Docker Security Scan

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker_scan.yml'
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker_scan.yml'

jobs:
  # ---------------------------------------------------------------
  # Lint Dockerfile
  # ---------------------------------------------------------------
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Hadolint
        id: hadolint
        continue-on-error: true
        run: |
          curl -sSL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint
          hadolint -f sarif Dockerfile > hadolint-results.sarif || true

      - name: Upload Hadolint SARIF
        if: always() && hashFiles('hadolint-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint
